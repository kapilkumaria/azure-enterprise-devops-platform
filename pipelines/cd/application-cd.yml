trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: aedp-application-ci
      trigger:
        branches:
          include:
            - main

pool:
  name: aedp-linux-pool

variables:
  azureServiceConnection: sc-aedp-azure-wif

  resourceGroup: rg-aedp-dev-cac
  aksCluster: aks-aedp-dev-cac

  devNamespace: applications
  stagingNamespace: applications-staging
  prodNamespace: applications-prod

  acrLoginServer: acraedpdev016rlp.azurecr.io
  imageRepository: azure-enterprise-demo

  imageTag: $(resources.pipeline.ci.runID)

stages:

  - stage: DeployDev
    displayName: Deploy to dev

    jobs:

      - deployment: DeployDevApplication
        displayName: Deploy immutable image to dev
        environment: aedp-dev

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  clean: true

                - template: ../templates/deploy-aks.yml
                  parameters:
                    azureServiceConnection: $(azureServiceConnection)
                    resourceGroup: $(resourceGroup)
                    aksCluster: $(aksCluster)
                    namespace: $(devNamespace)
                    acrLoginServer: $(acrLoginServer)
                    imageRepository: $(imageRepository)
                    imageTag: $(imageTag)
                    environmentLabel: dev

  - stage: DeployStaging
    displayName: Promote to staging
    dependsOn: DeployDev
    condition: succeeded()

    jobs:

      - deployment: DeployStagingApplication
        displayName: Deploy same immutable image to staging
        environment: aedp-staging

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  clean: true

                - task: AzureCLI@2
                  displayName: Authenticate to Azure and configure AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      echo "===== Configure AKS credentials ====="

                      az aks get-credentials \
                        --resource-group "$(resourceGroup)" \
                        --name "$(aksCluster)" \
                        --overwrite-existing

                      kubelogin convert-kubeconfig -l azurecli

                      echo "===== Verify staging namespace authorization ====="

                      kubectl auth can-i get deployments \
                        -n "$(stagingNamespace)"

                      kubectl auth can-i patch deployments \
                        -n "$(stagingNamespace)"

                      kubectl get deployment \
                        azure-enterprise-demo \
                        -n "$(stagingNamespace)"

                - script: |
                    set -euo pipefail

                    echo "===== Promote exact CI artifact ====="
                    echo "CI Run ID / Image Tag: $(resources.pipeline.ci.runID)"
                    echo "CI branch: $(resources.pipeline.ci.sourceBranch)"
                    echo "CI commit: $(resources.pipeline.ci.sourceCommit)"

                    echo "===== Current staging image ====="

                    kubectl get deployment \
                      azure-enterprise-demo \
                      -n "$(stagingNamespace)" \
                      -o jsonpath='{.spec.template.spec.containers[0].image}'

                    echo

                    echo "===== Deploy same immutable image to staging ====="

                    kubectl set image \
                      deployment/azure-enterprise-demo \
                      application="$(acrLoginServer)/$(imageRepository):$(imageTag)" \
                      -n "$(stagingNamespace)"

                    echo "===== Wait for staging rollout ====="

                    kubectl rollout status \
                      deployment/azure-enterprise-demo \
                      -n "$(stagingNamespace)" \
                      --timeout=180s

                    echo "===== Verify staging pods ====="

                    kubectl get pods \
                      -n "$(stagingNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o wide

                    echo "===== Verify staging image ====="

                    kubectl get pods \
                      -n "$(stagingNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].image}{"\n"}{end}'

                  displayName: Deploy and verify staging

  - stage: DeployProd
    displayName: Promote to production
    dependsOn: DeployStaging
    condition: succeeded()

    jobs:

      - deployment: DeployProdApplication
        displayName: Deploy same immutable image to production
        environment: aedp-prod

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  clean: true

                - task: AzureCLI@2
                  displayName: Authenticate to Azure and configure AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      echo "===== Configure AKS credentials ====="

                      az aks get-credentials \
                        --resource-group "$(resourceGroup)" \
                        --name "$(aksCluster)" \
                        --overwrite-existing

                      kubelogin convert-kubeconfig -l azurecli

                      echo "===== Verify production namespace authorization ====="

                      kubectl auth can-i get deployments \
                        -n "$(prodNamespace)"

                      kubectl auth can-i patch deployments \
                        -n "$(prodNamespace)"

                      kubectl get deployment \
                        azure-enterprise-demo \
                        -n "$(prodNamespace)"

                - script: |
                    set -euo pipefail

                    echo "===== Promote exact CI artifact to production ====="
                    echo "CI Run ID / Image Tag: $(resources.pipeline.ci.runID)"
                    echo "CI branch: $(resources.pipeline.ci.sourceBranch)"
                    echo "CI commit: $(resources.pipeline.ci.sourceCommit)"

                    echo "===== Current production image ====="

                    kubectl get deployment \
                      azure-enterprise-demo \
                      -n "$(prodNamespace)" \
                      -o jsonpath='{.spec.template.spec.containers[0].image}'

                    echo

                    echo "===== Deploy same immutable image to production ====="

                    kubectl set image \
                      deployment/azure-enterprise-demo \
                      application="$(acrLoginServer)/$(imageRepository):$(imageTag)" \
                      -n "$(prodNamespace)"

                    echo "===== Wait for production rollout ====="

                    kubectl rollout status \
                      deployment/azure-enterprise-demo \
                      -n "$(prodNamespace)" \
                      --timeout=180s

                    echo "===== Verify production pods ====="

                    kubectl get pods \
                      -n "$(prodNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o wide

                    echo "===== Verify production image ====="

                    kubectl get pods \
                      -n "$(prodNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].image}{"\n"}{end}'

                  displayName: Deploy and verify production
