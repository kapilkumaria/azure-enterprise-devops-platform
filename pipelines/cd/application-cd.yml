trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: aedp-application-ci
      trigger:
        branches:
          include:
            - main

pool:
  name: aedp-linux-pool

variables:
  azureServiceConnection: sc-aedp-azure-wif

  resourceGroup: rg-aedp-dev-cac
  aksCluster: aks-aedp-dev-cac

  devNamespace: applications
  stagingNamespace: applications-staging

  acrLoginServer: acraedpdevn47nuz.azurecr.io
  imageRepository: azure-enterprise-demo

  imageTag: $(resources.pipeline.ci.runID)

stages:

  - stage: DeployDev
    displayName: Deploy to dev

    jobs:

      - deployment: DeployDevApplication
        displayName: Deploy immutable image to dev
        environment: aedp-dev

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  clean: true

                - task: AzureCLI@2
                  displayName: Authenticate to Azure and configure AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      echo "===== Azure identity ====="

                      az account show \
                        --query '{
                          Subscription:name,
                          SubscriptionId:id,
                          Tenant:tenantId
                        }' \
                        -o table

                      echo "===== Configure AKS credentials ====="

                      az aks get-credentials \
                        --resource-group "$(resourceGroup)" \
                        --name "$(aksCluster)" \
                        --overwrite-existing

                      kubelogin convert-kubeconfig -l azurecli

                      echo "===== Verify dev namespace authorization ====="

                      kubectl auth can-i get deployments \
                        -n "$(devNamespace)"

                      kubectl auth can-i patch deployments \
                        -n "$(devNamespace)"

                      kubectl get deployment \
                        azure-enterprise-demo \
                        -n "$(devNamespace)"

                - script: |
                    set -euo pipefail

                    echo "===== CI artifact metadata ====="
                    echo "Trigger reason: $(Build.Reason)"
                    echo "CI pipeline: $(resources.pipeline.ci.pipelineName)"
                    echo "CI Run ID / Image Tag: $(resources.pipeline.ci.runID)"
                    echo "CI branch: $(resources.pipeline.ci.sourceBranch)"
                    echo "CI commit: $(resources.pipeline.ci.sourceCommit)"

                    echo "===== Current dev image ====="

                    kubectl get deployment \
                      azure-enterprise-demo \
                      -n "$(devNamespace)" \
                      -o jsonpath='{.spec.template.spec.containers[0].image}'

                    echo

                    echo "===== Deploy immutable image to dev ====="

                    kubectl set image \
                      deployment/azure-enterprise-demo \
                      application="$(acrLoginServer)/$(imageRepository):$(imageTag)" \
                      -n "$(devNamespace)"

                    echo "===== Wait for dev rollout ====="

                    kubectl rollout status \
                      deployment/azure-enterprise-demo \
                      -n "$(devNamespace)" \
                      --timeout=180s

                    echo "===== Verify dev pods ====="

                    kubectl get pods \
                      -n "$(devNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o wide

                    echo "===== Verify dev image ====="

                    kubectl get pods \
                      -n "$(devNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].image}{"\n"}{end}'

                  displayName: Deploy and verify dev


  - stage: DeployStaging
    displayName: Promote to staging
    dependsOn: DeployDev
    condition: succeeded()

    jobs:

      - deployment: DeployStagingApplication
        displayName: Deploy same immutable image to staging
        environment: aedp-staging

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  clean: true

                - task: AzureCLI@2
                  displayName: Authenticate to Azure and configure AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      echo "===== Configure AKS credentials ====="

                      az aks get-credentials \
                        --resource-group "$(resourceGroup)" \
                        --name "$(aksCluster)" \
                        --overwrite-existing

                      kubelogin convert-kubeconfig -l azurecli

                      echo "===== Verify staging namespace authorization ====="

                      kubectl auth can-i get deployments \
                        -n "$(stagingNamespace)"

                      kubectl auth can-i patch deployments \
                        -n "$(stagingNamespace)"

                      kubectl get deployment \
                        azure-enterprise-demo \
                        -n "$(stagingNamespace)"

                - script: |
                    set -euo pipefail

                    echo "===== Promote exact CI artifact ====="
                    echo "CI Run ID / Image Tag: $(resources.pipeline.ci.runID)"
                    echo "CI branch: $(resources.pipeline.ci.sourceBranch)"
                    echo "CI commit: $(resources.pipeline.ci.sourceCommit)"

                    echo "===== Current staging image ====="

                    kubectl get deployment \
                      azure-enterprise-demo \
                      -n "$(stagingNamespace)" \
                      -o jsonpath='{.spec.template.spec.containers[0].image}'

                    echo

                    echo "===== Deploy same immutable image to staging ====="

                    kubectl set image \
                      deployment/azure-enterprise-demo \
                      application="$(acrLoginServer)/$(imageRepository):$(imageTag)" \
                      -n "$(stagingNamespace)"

                    echo "===== Wait for staging rollout ====="

                    kubectl rollout status \
                      deployment/azure-enterprise-demo \
                      -n "$(stagingNamespace)" \
                      --timeout=180s

                    echo "===== Verify staging pods ====="

                    kubectl get pods \
                      -n "$(stagingNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o wide

                    echo "===== Verify staging image ====="

                    kubectl get pods \
                      -n "$(stagingNamespace)" \
                      -l app=azure-enterprise-demo \
                      -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].image}{"\n"}{end}'

                  displayName: Deploy and verify staging
