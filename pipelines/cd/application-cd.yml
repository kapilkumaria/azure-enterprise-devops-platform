trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: aedp-application-ci
      trigger:
        branches:
          include:
            - main

pool:
  name: aedp-linux-pool

variables:
  azureServiceConnection: sc-aedp-azure-wif

  resourceGroup: rg-aedp-dev-cac
  aksCluster: aks-aedp-dev-cac

  devNamespace: applications
  stagingNamespace: applications-staging
  prodNamespace: applications-prod

  acrLoginServer: acraedpdev016rlp.azurecr.io
  imageRepository: azure-enterprise-demo


stages:

  - stage: DeployDev
    displayName: Deploy to dev

    jobs:

      - template: ../templates/deploy-job.yml
        parameters:
          deploymentName: DeployDevApplication
          displayName: Deploy immutable digest to dev
          environmentName: aedp-dev
          environmentLabel: dev
          namespace: $(devNamespace)
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          aksCluster: $(aksCluster)
          acrLoginServer: $(acrLoginServer)
          imageRepository: $(imageRepository)


  - stage: DeployStaging
    displayName: Promote to staging
    dependsOn: DeployDev
    condition: succeeded()

    jobs:

      - template: ../templates/deploy-job.yml
        parameters:
          deploymentName: DeployStagingApplication
          displayName: Promote same immutable digest to staging
          environmentName: aedp-staging
          environmentLabel: staging
          namespace: $(stagingNamespace)
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          aksCluster: $(aksCluster)
          acrLoginServer: $(acrLoginServer)
          imageRepository: $(imageRepository)


  - stage: DeployProd
    displayName: Promote to production
    dependsOn: DeployStaging
    condition: succeeded()

    jobs:

      - template: ../templates/deploy-job.yml
        parameters:
          deploymentName: DeployProdApplication
          displayName: Promote same immutable digest to production
          environmentName: aedp-prod
          environmentLabel: production
          namespace: $(prodNamespace)
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          aksCluster: $(aksCluster)
          acrLoginServer: $(acrLoginServer)
          imageRepository: $(imageRepository)
