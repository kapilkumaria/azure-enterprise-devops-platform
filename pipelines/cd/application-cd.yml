trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: aedp-application-ci
      trigger:
        branches:
          include:
            - main


pool:
  name: aedp-linux-pool


variables:
  azureServiceConnection: sc-aedp-azure-wif

  resourceGroup: rg-aedp-dev-cac
  aksCluster: aks-aedp-dev-cac

  devNamespace: applications
  stagingNamespace: applications-staging
  prodNamespace: applications-prod

  acrName: acraedpdevt5b3uy
  acrLoginServer: acraedpdevt5b3uy.azurecr.io
  imageRepository: azure-enterprise-demo


stages:

  - stage: VerifyArtifact
    displayName: Verify signed artifact before deployment

    jobs:

      - job: VerifySignedImage
        displayName: Verify immutable image signature with Notation

        steps:

          - download: none

          - checkout: self
            clean: true

          - download: ci
            artifact: image-metadata

          - script: |
              set -euo pipefail

              METADATA_FILE="$(Pipeline.Workspace)/ci/image-metadata/image-metadata.json"
              DIGEST_FILE="$(Pipeline.Workspace)/ci/image-metadata/image-digest.txt"

              echo "===== CI immutable image metadata ====="

              if [ ! -f "${METADATA_FILE}" ]; then
                echo "ERROR: CI image metadata file does not exist:"
                echo "${METADATA_FILE}"
                exit 1
              fi

              if [ ! -f "${DIGEST_FILE}" ]; then
                echo "ERROR: CI image digest file does not exist:"
                echo "${DIGEST_FILE}"
                exit 1
              fi

              cat "${METADATA_FILE}"

              echo
              echo "===== Load immutable image digest ====="

              DIGEST="$(tr -d '\r\n' < "${DIGEST_FILE}")"

              if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: Invalid image digest: ${DIGEST}"
                exit 1
              fi

              IMAGE="$(acrLoginServer)/$(imageRepository)@${DIGEST}"

              echo "Digest: ${DIGEST}"
              echo "Image: ${IMAGE}"

              echo "##vso[task.setvariable variable=imageDigest]${DIGEST}"

            displayName: Validate CI image metadata and digest

          - template: ../templates/notation-verify.yml
            parameters:
              azureServiceConnection: $(azureServiceConnection)
              acrName: $(acrName)
              acrLoginServer: $(acrLoginServer)
              imageRepository: $(imageRepository)
              imageDigest: $(imageDigest)


  - stage: DeployDev
    displayName: Deploy to dev
    dependsOn: VerifyArtifact
    condition: succeeded()

    jobs:

      - template: ../templates/deploy-job.yml
        parameters:
          deploymentName: DeployDevApplication
          displayName: Deploy verified immutable digest to dev
          environmentName: aedp-dev
          environmentLabel: dev
          namespace: $(devNamespace)
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          aksCluster: $(aksCluster)
          acrLoginServer: $(acrLoginServer)
          imageRepository: $(imageRepository)


  - stage: DeployStaging
    displayName: Promote to staging
    dependsOn: DeployDev
    condition: succeeded()

    jobs:

      - template: ../templates/deploy-job.yml
        parameters:
          deploymentName: DeployStagingApplication
          displayName: Promote verified immutable digest to staging
          environmentName: aedp-staging
          environmentLabel: staging
          namespace: $(stagingNamespace)
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          aksCluster: $(aksCluster)
          acrLoginServer: $(acrLoginServer)
          imageRepository: $(imageRepository)


  - stage: DeployProd
    displayName: Promote to production
    dependsOn: DeployStaging
    condition: succeeded()

    jobs:

      - template: ../templates/deploy-job.yml
        parameters:
          deploymentName: DeployProdApplication
          displayName: Promote verified immutable digest to production
          environmentName: aedp-prod
          environmentLabel: production
          namespace: $(prodNamespace)
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          aksCluster: $(aksCluster)
          acrLoginServer: $(acrLoginServer)
          imageRepository: $(imageRepository)
