trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: aedp-application-ci
      trigger:
        branches:
          include:
            - main

pool:
  name: aedp-linux-pool

variables:
  azureServiceConnection: sc-aedp-azure-wif

  resourceGroup: rg-aedp-dev-cac
  aksCluster: aks-aedp-dev-cac
  namespace: applications

  acrLoginServer: acraedpdevn47nuz.azurecr.io
  imageRepository: azure-enterprise-demo

  imageTag: $(resources.pipeline.ci.runID)

stages:

  - stage: Deploy
    displayName: Deploy application to AKS

    jobs:

      - deployment: DeployApplication
        displayName: Deploy immutable image
        environment: aedp-dev

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self
                  clean: true

                - task: AzureCLI@2
                  displayName: Authenticate to Azure and configure AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      echo "===== Azure identity ====="

                      az account show \
                        --query '{
                          Subscription:name,
                          SubscriptionId:id,
                          Tenant:tenantId
                        }' \
                        -o table

                      echo "===== Get AKS credentials ====="

                      az aks get-credentials \
                        --resource-group "$(resourceGroup)" \
                        --name "$(aksCluster)" \
                        --overwrite-existing

                      kubelogin convert-kubeconfig -l azurecli

                      echo "===== Verify AKS authorization ====="

                      kubectl auth can-i get deployments \
                        -n "$(namespace)"

                      kubectl auth can-i patch deployments \
                        -n "$(namespace)"

                      kubectl get deployment \
                        azure-enterprise-demo \
                        -n "$(namespace)"

                - script: |
                    set -euo pipefail

                    echo "===== Current image ====="

                    kubectl get deployment \
                      azure-enterprise-demo \
                      -n "$(namespace)" \
                      -o jsonpath='{.spec.template.spec.containers[0].image}'

                    echo

                    echo "===== CI pipeline metadata ====="
                    echo "Trigger reason: $(Build.Reason)"
                    echo "CI pipeline: $(resources.pipeline.ci.pipelineName)"
                    echo "CI Run ID / Image Tag: $(resources.pipeline.ci.runID)"
                    echo "CI branch: $(resources.pipeline.ci.sourceBranch)"
                    echo "CI commit: $(resources.pipeline.ci.sourceCommit)"

                    echo "===== Deploy new image ====="

                    kubectl set image \
                      deployment/azure-enterprise-demo \
                      application="$(acrLoginServer)/$(imageRepository):$(imageTag)" \
                      -n "$(namespace)"

                    echo "===== Wait for rollout ====="

                    kubectl rollout status \
                      deployment/azure-enterprise-demo \
                      -n "$(namespace)" \
                      --timeout=180s

                    echo "===== Running pods ====="

                    kubectl get pods \
                      -n "$(namespace)" \
                      -l app=azure-enterprise-demo \
                      -o wide

                    echo "===== Running image ====="

                    kubectl get pods \
                      -n "$(namespace)" \
                      -l app=azure-enterprise-demo \
                      -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].image}{"\n"}{end}'

                  displayName: Deploy and verify application
