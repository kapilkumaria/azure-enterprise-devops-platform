trigger:
  branches:
    include:
      - main

  paths:
    include:
      - application/**
      - pipelines/ci/application-ci.yml
      - pipelines/templates/**

pr:
  branches:
    include:
      - main

  paths:
    include:
      - application/**
      - pipelines/ci/application-ci.yml
      - pipelines/templates/**


pool:
  name: aedp-linux-pool


variables:
  azureServiceConnection: sc-aedp-azure-wif

  acrName: acraedpdev016rlp
  acrLoginServer: acraedpdev016rlp.azurecr.io

  imageRepository: azure-enterprise-demo

  imageTag: $(Build.BuildId)

  dockerfilePath: $(Build.SourcesDirectory)/application/Dockerfile

  buildContext: $(Build.SourcesDirectory)/application

stages:

  - stage: Validate
    displayName: Validate application

    jobs:

      - job: ValidateApplication
        displayName: Validate Python application

        steps:

          - checkout: self
            clean: true

          - template: ../templates/python-validate.yml
            parameters:
              requirementsFile: application/requirements.txt
              sourceDirectory: application/src
              virtualEnvironment: .venv


  - stage: BuildAndPush
    displayName: Build and push container
    dependsOn: Validate
    condition: succeeded()

    jobs:

      - job: BuildAndPushContainer
        displayName: Build and push immutable image

        steps:

          - checkout: self
            clean: true

          - template: ../templates/docker-build-push.yml
            parameters:
              azureServiceConnection: $(azureServiceConnection)
              acrName: $(acrName)
              acrLoginServer: $(acrLoginServer)
              imageRepository: $(imageRepository)
              imageTag: $(imageTag)
              dockerfilePath: $(dockerfilePath)
              buildContext: $(buildContext)

  - stage: SecurityScan
    displayName: Security scan
    dependsOn: BuildAndPush
    condition: succeeded()

    jobs:

      - job: ScanContainerImage
        displayName: Scan immutable image with Trivy

        steps:

          - checkout: self
            clean: true

          - template: ../templates/trivy-image-scan.yml
            parameters:
              image: $(acrLoginServer)/$(imageRepository):$(imageTag)
              severity: HIGH,CRITICAL
              ignoreUnfixed: true
