trigger:
  branches:
    include:
      - main

  paths:
    include:
      - application/**
      - pipelines/ci/application-ci.yml
      - pipelines/templates/**

pr:
  branches:
    include:
      - main

  paths:
    include:
      - application/**
      - pipelines/ci/application-ci.yml
      - pipelines/templates/**


pool:
  name: aedp-linux-pool


variables:
  azureServiceConnection: sc-aedp-azure-wif

  acrName: acraedpdevj30iq9
  acrLoginServer: acraedpdevj30iq9.azurecr.io

  imageRepository: azure-enterprise-demo

  imageTag: $(Build.BuildId)

  dockerfilePath: $(Build.SourcesDirectory)/application/Dockerfile
  buildContext: $(Build.SourcesDirectory)/application


stages:

  - stage: Validate
    displayName: Validate application

    jobs:

      - job: ValidateApplication
        displayName: Validate Python application

        steps:

          - checkout: self
            clean: true

          - template: ../templates/python-validate.yml
            parameters:
              requirementsFile: application/requirements.txt
              sourceDirectory: application/src
              virtualEnvironment: .venv


  - stage: SourceSecurityScan
    displayName: Source security scan
    dependsOn: Validate
    condition: succeeded()

    jobs:

      - job: ScanRepository
        displayName: Scan repository with Trivy

        steps:

          - checkout: self
            clean: true

          - template: ../templates/trivy-filesystem-scan.yml
            parameters:
              scanPath: .
              severity: HIGH,CRITICAL


  - stage: BuildAndPush
    displayName: Build and push container
    dependsOn: SourceSecurityScan
    condition: succeeded()

    jobs:

      - job: BuildAndPushContainer
        displayName: Build and push immutable image

        steps:

          - checkout: self
            clean: true

          - template: ../templates/docker-build-push.yml
            parameters:
              azureServiceConnection: $(azureServiceConnection)
              acrName: $(acrName)
              acrLoginServer: $(acrLoginServer)
              imageRepository: $(imageRepository)
              imageTag: $(imageTag)
              dockerfilePath: $(dockerfilePath)
              buildContext: $(buildContext)


  - stage: SecurityScan
    displayName: Security scan
    dependsOn: BuildAndPush
    condition: succeeded()

    jobs:

      - job: ScanContainerImage
        displayName: Scan immutable image with Trivy

        steps:

          - checkout: self
            clean: true

          - download: current
            artifact: image-metadata

          - script: |
              set -euo pipefail

              DIGEST_FILE="$(Pipeline.Workspace)/image-metadata/image-digest.txt"

              echo "===== Load immutable image digest ====="
              echo "Digest file: ${DIGEST_FILE}"

              DIGEST="$(tr -d '\r\n' < "${DIGEST_FILE}")"

              if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: Invalid image digest: ${DIGEST}"
                exit 1
              fi

              echo "Digest: ${DIGEST}"

              echo "##vso[task.setvariable variable=imageDigest]${DIGEST}"

            displayName: Load immutable image digest

          - template: ../templates/trivy-image-scan.yml
            parameters:
              image: $(acrLoginServer)/$(imageRepository)@$(imageDigest)
              severity: HIGH,CRITICAL
              ignoreUnfixed: true


  - stage: SignAndVerify
    displayName: Sign and verify immutable image
    dependsOn: SecurityScan
    condition: succeeded()

    jobs:

      - job: SignAndVerifyImage
        displayName: Sign and verify image with Notation

        steps:

          - checkout: self
            clean: true

          - download: current
            artifact: image-metadata

          - script: |
              set -euo pipefail

              DIGEST_FILE="$(Pipeline.Workspace)/image-metadata/image-digest.txt"

              echo "===== Load immutable image digest ====="

              DIGEST="$(tr -d '\r\n' < "${DIGEST_FILE}")"

              if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: Invalid image digest: ${DIGEST}"
                exit 1
              fi

              echo "Digest: ${DIGEST}"

              echo "##vso[task.setvariable variable=imageDigest]${DIGEST}"

            displayName: Load immutable image digest

          - template: ../templates/notation-sign-verify.yml
            parameters:
              azureServiceConnection: $(azureServiceConnection)
              acrName: $(acrName)
              acrLoginServer: $(acrLoginServer)
              imageRepository: $(imageRepository)
              imageDigest: $(imageDigest)
              signingKeyId: https://kv-aedp-dev-04g3hx.vault.azure.net/keys/aedp-container-signing/79c28285f5724e90aaa635eecae92ec7
