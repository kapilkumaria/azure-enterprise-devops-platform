parameters:
  - name: azureServiceConnection
    type: string

  - name: resourceGroup
    type: string

  - name: aksCluster
    type: string

  - name: namespace
    type: string

  - name: acrLoginServer
    type: string

  - name: imageRepository
    type: string

  - name: imageDigestFile
    type: string

  - name: environmentLabel
    type: string

steps:

  - task: AzureCLI@2
    displayName: Authenticate to Azure and configure AKS
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        echo "===== Azure identity ====="

        az account show \
          --query '{
            Subscription:name,
            SubscriptionId:id,
            Tenant:tenantId
          }' \
          -o table

        echo "===== Configure AKS credentials ====="

        az aks get-credentials \
          --resource-group "${{ parameters.resourceGroup }}" \
          --name "${{ parameters.aksCluster }}" \
          --overwrite-existing

        kubelogin convert-kubeconfig -l azurecli

        echo "===== Verify Kubernetes authorization ====="

        kubectl auth can-i get deployments \
          -n "${{ parameters.namespace }}"

        kubectl auth can-i patch deployments \
          -n "${{ parameters.namespace }}"

        kubectl get deployment \
          azure-enterprise-demo \
          -n "${{ parameters.namespace }}"

  - script: |
      set -euo pipefail

      DIGEST_FILE="${{ parameters.imageDigestFile }}"

      echo "===== Deployment target ====="
      echo "Environment: ${{ parameters.environmentLabel }}"
      echo "Namespace: ${{ parameters.namespace }}"

      echo "===== Load immutable digest ====="
      echo "Digest file: ${DIGEST_FILE}"

      DIGEST="$(tr -d '\r\n' < "${DIGEST_FILE}")"

      if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
        echo "ERROR: Invalid image digest: ${DIGEST}"
        exit 1
      fi

      IMAGE="${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}@${DIGEST}"

      echo "===== Immutable artifact ====="
      echo "Digest: ${DIGEST}"
      echo "Image: ${IMAGE}"

      echo "===== Current image ====="

      kubectl get deployment \
        azure-enterprise-demo \
        -n "${{ parameters.namespace }}" \
        -o jsonpath='{.spec.template.spec.containers[0].image}'

      echo

      echo "===== Deploy image by immutable digest ====="

      kubectl set image \
        deployment/azure-enterprise-demo \
        application="${IMAGE}" \
        -n "${{ parameters.namespace }}"

      echo "===== Wait for rollout ====="

      kubectl rollout status \
        deployment/azure-enterprise-demo \
        -n "${{ parameters.namespace }}" \
        --timeout=180s

      echo "===== Running pods ====="

      kubectl get pods \
        -n "${{ parameters.namespace }}" \
        -l app=azure-enterprise-demo \
        -o wide

      echo "===== Deployment image ====="

      kubectl get deployment \
        azure-enterprise-demo \
        -n "${{ parameters.namespace }}" \
        -o jsonpath='{.spec.template.spec.containers[0].image}'

      echo

      echo "===== Runtime image IDs ====="

      kubectl get pods \
        -n "${{ parameters.namespace }}" \
        -l app=azure-enterprise-demo \
        -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

      echo "===== Digest deployment verified ====="

    displayName: Deploy and verify ${{ parameters.environmentLabel }}
