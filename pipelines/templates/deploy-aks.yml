parameters:
  - name: azureServiceConnection
    type: string

  - name: resourceGroup
    type: string

  - name: aksCluster
    type: string

  - name: namespace
    type: string

  - name: acrLoginServer
    type: string

  - name: imageRepository
    type: string

  - name: imageTag
    type: string

  - name: environmentLabel
    type: string

steps:

  - task: AzureCLI@2
    displayName: Authenticate to Azure and configure AKS
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        echo "===== Azure identity ====="

        az account show \
          --query '{
            Subscription:name,
            SubscriptionId:id,
            Tenant:tenantId
          }' \
          -o table

        echo "===== Configure AKS credentials ====="

        az aks get-credentials \
          --resource-group "${{ parameters.resourceGroup }}" \
          --name "${{ parameters.aksCluster }}" \
          --overwrite-existing

        kubelogin convert-kubeconfig -l azurecli

        echo "===== Verify Kubernetes authorization ====="

        kubectl auth can-i get deployments \
          -n "${{ parameters.namespace }}"

        kubectl auth can-i patch deployments \
          -n "${{ parameters.namespace }}"

        kubectl get deployment \
          azure-enterprise-demo \
          -n "${{ parameters.namespace }}"

  - script: |
      set -euo pipefail

      echo "===== Deployment target ====="
      echo "Environment: ${{ parameters.environmentLabel }}"
      echo "Namespace: ${{ parameters.namespace }}"

      echo "===== Immutable artifact ====="
      echo "Image: ${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:${{ parameters.imageTag }}"

      echo "===== Current image ====="

      kubectl get deployment \
        azure-enterprise-demo \
        -n "${{ parameters.namespace }}" \
        -o jsonpath='{.spec.template.spec.containers[0].image}'

      echo

      echo "===== Deploy immutable image ====="

      kubectl set image \
        deployment/azure-enterprise-demo \
        application="${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:${{ parameters.imageTag }}" \
        -n "${{ parameters.namespace }}"

      echo "===== Wait for rollout ====="

      kubectl rollout status \
        deployment/azure-enterprise-demo \
        -n "${{ parameters.namespace }}" \
        --timeout=180s

      echo "===== Running pods ====="

      kubectl get pods \
        -n "${{ parameters.namespace }}" \
        -l app=azure-enterprise-demo \
        -o wide

      echo "===== Running image ====="

      kubectl get pods \
        -n "${{ parameters.namespace }}" \
        -l app=azure-enterprise-demo \
        -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].image}{"\n"}{end}'

    displayName: Deploy and verify ${{ parameters.environmentLabel }}
