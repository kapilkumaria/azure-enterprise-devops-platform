parameters:
  - name: image
    type: string

  - name: severity
    type: string
    default: HIGH,CRITICAL

  - name: ignoreUnfixed
    type: boolean
    default: true

  - name: reportDirectory
    type: string
    default: $(Build.ArtifactStagingDirectory)/trivy-image

steps:

  - script: |
      set -euo pipefail

      echo "===== Trivy version ====="
      trivy --version

      echo "===== Security scan target ====="
      echo "Image: ${{ parameters.image }}"
      echo "Severity gate: ${{ parameters.severity }}"
      echo "Ignore unfixed: ${{ parameters.ignoreUnfixed }}"

      mkdir -p "${{ parameters.reportDirectory }}"

      EXTRA_ARGS=""

      if [ "${{ parameters.ignoreUnfixed }}" = "True" ] || \
         [ "${{ parameters.ignoreUnfixed }}" = "true" ]; then
        EXTRA_ARGS="--ignore-unfixed"
      fi

      echo "===== Generate JSON image report ====="

      trivy image \
        --scanners vuln \
        --severity "${{ parameters.severity }}" \
        ${EXTRA_ARGS} \
        --format json \
        --output "${{ parameters.reportDirectory }}/trivy-image.json" \
        "${{ parameters.image }}"

      echo "===== Generate SARIF image report ====="

      trivy image \
        --scanners vuln \
        --severity "${{ parameters.severity }}" \
        ${EXTRA_ARGS} \
        --format sarif \
        --output "${{ parameters.reportDirectory }}/trivy-image.sarif" \
        "${{ parameters.image }}"

      echo "===== Generate CycloneDX SBOM ====="

      trivy image \
        --format cyclonedx \
        --output "${{ parameters.reportDirectory }}/trivy-image.cdx.json" \
        "${{ parameters.image }}"

      echo "===== Enforce image vulnerability gate ====="

      trivy image \
        --scanners vuln \
        --severity "${{ parameters.severity }}" \
        --exit-code 1 \
        ${EXTRA_ARGS} \
        --no-progress \
        "${{ parameters.image }}"

      echo "===== Trivy security gate passed ====="

    displayName: Trivy vulnerability scan

  - task: PublishPipelineArtifact@1
    displayName: Publish Trivy image security report
    condition: always()
    inputs:
      targetPath: ${{ parameters.reportDirectory }}
      artifact: trivy-image-report
      publishLocation: pipeline
