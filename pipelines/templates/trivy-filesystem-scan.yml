parameters:
  - name: scanPath
    type: string
    default: .

  - name: severity
    type: string
    default: HIGH,CRITICAL

  - name: reportDirectory
    type: string
    default: $(Build.ArtifactStagingDirectory)/trivy-source

steps:

  - script: |
      set -euo pipefail

      echo "===== Trivy version ====="
      trivy --version

      echo "===== Filesystem security scan ====="
      echo "Path: ${{ parameters.scanPath }}"
      echo "Severity gate: ${{ parameters.severity }}"

      mkdir -p "${{ parameters.reportDirectory }}"

      echo "===== Generate JSON report ====="

      trivy fs \
        --scanners vuln,misconfig,secret \
        --severity "${{ parameters.severity }}" \
        --ignore-unfixed \
        --skip-files "**/*.tfstate" \
        --skip-files "**/*.tfstate.*" \
        --skip-files "**/*.tfplan" \
        --skip-files "**/*.tfplan.*" \
        --skip-dirs "**/.terraform" \
        --format json \
        --output "${{ parameters.reportDirectory }}/trivy-source.json" \
        "${{ parameters.scanPath }}"

      echo "===== Generate SARIF report ====="

      trivy fs \
        --scanners vuln,misconfig,secret \
        --severity "${{ parameters.severity }}" \
        --ignore-unfixed \
        --skip-files "**/*.tfstate" \
        --skip-files "**/*.tfstate.*" \
        --skip-files "**/*.tfplan" \
        --skip-files "**/*.tfplan.*" \
        --skip-dirs "**/.terraform" \
        --format sarif \
        --output "${{ parameters.reportDirectory }}/trivy-source.sarif" \
        "${{ parameters.scanPath }}"

      echo "===== Enforce filesystem security gate ====="

      trivy fs \
        --scanners vuln,misconfig,secret \
        --severity "${{ parameters.severity }}" \
        --ignore-unfixed \
        --skip-files "**/*.tfstate" \
        --skip-files "**/*.tfstate.*" \
        --skip-files "**/*.tfplan" \
        --skip-files "**/*.tfplan.*" \
        --skip-dirs "**/.terraform" \
        --exit-code 1 \
        --no-progress \
        "${{ parameters.scanPath }}"

      echo "===== Filesystem security gate passed ====="

    displayName: Trivy filesystem security scan

  - task: PublishPipelineArtifact@1
    displayName: Publish Trivy source security report
    condition: always()
    inputs:
      targetPath: ${{ parameters.reportDirectory }}
      artifact: trivy-source-report
      publishLocation: pipeline
