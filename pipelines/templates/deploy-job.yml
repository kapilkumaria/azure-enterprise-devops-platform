parameters:
  - name: deploymentName
    type: string

  - name: displayName
    type: string

  - name: environmentName
    type: string

  - name: environmentLabel
    type: string

  - name: namespace
    type: string

  - name: azureServiceConnection
    type: string

  - name: resourceGroup
    type: string

  - name: aksCluster
    type: string

  - name: acrLoginServer
    type: string

  - name: imageRepository
    type: string

jobs:

  - deployment: ${{ parameters.deploymentName }}
    displayName: ${{ parameters.displayName }}
    environment: ${{ parameters.environmentName }}

    strategy:
      runOnce:
        deploy:
          steps:

            - download: none

            - checkout: self
              clean: true

            - download: ci
              artifact: image-metadata

            - script: |
                set -euo pipefail

                echo "===== CI immutable image metadata ====="

                cat \
                  "$(Pipeline.Workspace)/ci/image-metadata/image-metadata.json"

              displayName: Verify CI image metadata

            - template: deploy-aks.yml
              parameters:
                azureServiceConnection: ${{ parameters.azureServiceConnection }}
                resourceGroup: ${{ parameters.resourceGroup }}
                aksCluster: ${{ parameters.aksCluster }}
                namespace: ${{ parameters.namespace }}
                acrLoginServer: ${{ parameters.acrLoginServer }}
                imageRepository: ${{ parameters.imageRepository }}
                imageDigestFile: $(Pipeline.Workspace)/ci/image-metadata/image-digest.txt
                environmentLabel: ${{ parameters.environmentLabel }}
