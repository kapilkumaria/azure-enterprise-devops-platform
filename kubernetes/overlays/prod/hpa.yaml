apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: azure-enterprise-demo
  namespace: applications-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: azure-enterprise-demo

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
