apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-workload
  namespace: applications-prod
spec:
  provider: azure

  secretObjects:
    - secretName: demo-keyvault-secret
      type: Opaque
      data:
        - objectName: demo-message
          key: demo-message

  parameters:
    usePodIdentity: "false"
    clientID: "5be6c8a2-453a-40e0-8b4d-ac6dcbb52ea8"
    keyvaultName: "kv-aedp-dev-fnapx6"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: demo-message
          objectType: secret
          objectVersion: ""
    tenantId: "78591d21-16e0-46d0-8cbb-95fcc94db601"
