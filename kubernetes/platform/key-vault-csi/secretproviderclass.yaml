apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-workload
  namespace: applications
spec:
  provider: azure

  secretObjects:
    - secretName: demo-keyvault-secret
      type: Opaque
      data:
        - objectName: demo-message
          key: demo-message

  parameters:
    usePodIdentity: "false"
    clientID: "0d466aa0-04b6-4675-9c22-d84e6836f214"
    keyvaultName: "kv-aedp-dev-3794hh"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: demo-message
          objectType: secret
          objectVersion: ""
    tenantId: "78591d21-16e0-46d0-8cbb-95fcc94db601"
