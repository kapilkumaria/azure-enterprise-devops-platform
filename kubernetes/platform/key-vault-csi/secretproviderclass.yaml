apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-workload
  namespace: applications
spec:
  provider: azure

  secretObjects:
    - secretName: demo-keyvault-secret
      type: Opaque
      data:
        - objectName: demo-message
          key: demo-message

  parameters:
    usePodIdentity: "false"
    clientID: "7c0a5f9f-a817-4626-89c3-4ec3a0dc26d7"
    keyvaultName: "kv-aedp-dev-m0e0za"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: demo-message
          objectType: secret
          objectVersion: ""
    tenantId: "78591d21-16e0-46d0-8cbb-95fcc94db601"
